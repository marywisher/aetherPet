# aetherPet 本地开发 MySQL 8 容器
# 与生产（宝塔 MySQL 8）同构，避免方言差异
# 启动：docker compose -f docker/docker-compose.dev.yml up -d mysql
# 停止：docker compose -f docker/docker-compose.dev.yml down
# 清数据：docker compose -f docker/docker-compose.dev.yml down -v
#
# 说明：表结构由应用侧 migration 管理（src/domain/persistence/migrations/001_init.sql）
#      首次启动应用时会自动执行（DB_AUTO_MIGRATE=true）。
#      本 compose 只负责创建数据库与用户。
name: aetherpet-dev

services:
  mysql:
    image: mysql:8.4
    container_name: aetherpet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ***
      MYSQL_DATABASE: aetherpet
      MYSQL_USER: aetherpet
      MYSQL_PASSWORD: ***
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - aetherpet_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
      - --default-time-zone='+08:00'
      - --innodb-buffer-pool-size=800M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aetherpet_mysql_data:
